<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 200" width="100%" height="100%" id="sushi-latte-receipt-logo">
  <!-- Optimized for 58mm ESC/POS Thermal Receipt Printers (384 dots width) -->
  <g fill="#000000" stroke="none">
    <!-- Icon Left (X: 10 to 110) -->
    <!-- Steam Lines -->
    <path d="M 52,24 C 48,15 56,8 52,0 L 49,0 C 46,9 53,16 49,24 Z"/>
    <path d="M 64,20 C 60,10 68,4 64,-4 L 61,-4 C 57,5 65,11 61,20 Z"/>
    <path d="M 76,24 C 80,15 72,8 76,0 L 73,0 C 69,9 77,16 73,24 Z"/>

    <!-- Outer Nori Enso -->
    <path d="M 64,28 C 96,28 116,52 116,84 C 116,116 94,140 64,140 C 34,140 12,116 12,84 C 12,58 30,34 56,29 L 58,35 C 35,39 20,60 20,84 C 20,111 39,132 64,132 C 89,132 108,111 108,84 C 108,58 92,36 64,36 Z"/>

    <!-- Cup Outline & Handle -->
    <path d="M 32,84 C 32,122 50,136 64,136 C 78,136 96,122 96,84 Z" fill="none" stroke="#000000" stroke-width="4"/>
    <path d="M 94,88 C 108,90 114,102 106,114 C 100,120 95,122 92,122" fill="none" stroke="#000000" stroke-width="4"/>
    <line x1="46" y1="144" x2="82" y2="144" stroke="#000000" stroke-width="3"/>

    <!-- Center Salmon Heart / Coffee Bean -->
    <path d="M 64,74 C 74,74 80,83 75,93 C 70,101 64,107 64,107 C 64,107 58,101 53,93 C 48,83 54,74 64,74 Z"/>
    <!-- Bean Seam cutout -->
    <path d="M 64,76 C 65,84 63,94 64,104" stroke="#FFFFFF" stroke-width="1.8" fill="none"/>

    <!-- Typography Right (X: 130 to 370) -->
    <g transform="translate(130, 0)">
      <!-- Japanese Sub-script -->
      <text x="0" y="42" font-family="'Courier New', monospace, sans-serif" font-size="12" font-weight="bold" letter-spacing="2">鮨 × 珈琲・ラテ</text>

      <!-- Main Heading: SUSHI LATTE -->
      <text x="0" y="86" font-family="'Arial Black', Impact, sans-serif" font-size="28" font-weight="900" letter-spacing="2">SUSHI LATTE</text>

      <!-- Tagline -->
      <text x="0" y="112" font-family="'Courier New', monospace, sans-serif" font-size="10.5" font-weight="bold" letter-spacing="1.5">CRAFT SUSHI &amp; SPECIALTY COFFEE</text>

      <!-- Receipt rule line -->
      <line x1="0" y1="130" x2="240" y2="130" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 2"/>
      <text x="0" y="148" font-family="'Courier New', monospace, sans-serif" font-size="9" letter-spacing="1">JAKARTA • OFFICIAL RECEIPT</text>
    </g>
  </g>
</svg>
