<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 560" width="100%" height="100%" id="sushi-latte-logo-vertical" class="sushi-latte-vector">
  <defs>
    <!-- Warm Latte Crema Gradient -->
    <linearGradient id="slv-crema-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED9C4"/>
      <stop offset="50%" stop-color="#DDB892"/>
      <stop offset="100%" stop-color="#B08968"/>
    </linearGradient>

    <!-- Rich Espresso Coffee Gradient -->
    <linearGradient id="slv-espresso-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C3D2E"/>
      <stop offset="100%" stop-color="#2D1A12"/>
    </linearGradient>

    <!-- Premium Fresh Salmon Gradient -->
    <linearGradient id="slv-salmon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A65"/>
      <stop offset="60%" stop-color="#F4511E"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>

    <!-- Nori Charcoal Gradient -->
    <linearGradient id="slv-nori-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3134"/>
      <stop offset="100%" stop-color="#141618"/>
    </linearGradient>

    <!-- Ceramic Warm White Gradient -->
    <linearGradient id="slv-ceramic-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFE8DD"/>
    </linearGradient>

    <!-- Matcha Accent Gradient -->
    <linearGradient id="slv-matcha-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81A263"/>
      <stop offset="100%" stop-color="#4C6B38"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="slv-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1A1512" flood-opacity="0.12"/>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap');
      .brand-title-vert {
        font-family: 'Cinzel', 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-weight: 700;
        letter-spacing: 0.18em;
      }
      .brand-subtitle-vert {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-weight: 600;
        letter-spacing: 0.24em;
        font-size: 13.5px;
        text-transform: uppercase;
      }
      .japanese-vert {
        font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
        font-size: 15px;
        letter-spacing: 0.35em;
      }
      #sushi-latte-logo-vertical:hover #slv-steam-paths path {
        transform: translateY(-8px);
        transition: transform 0.4s ease;
      }
    </style>
  </defs>

  <!-- Ambient Backdrop Circle -->
  <circle cx="225" cy="180" r="160" fill="#FAF6F0" opacity="0.65"/>

  <!-- STEAM VAPOR -->
  <g id="slv-steam-paths" opacity="0.85">
    <path d="M 195,100 C 185,80 202,60 194,40 C 190,30 184,24 186,12" 
          fill="none" stroke="url(#slv-crema-grad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 225,92 C 218,68 238,48 226,24 C 220,12 225,5 224,-5" 
          fill="none" stroke="url(#slv-salmon-grad)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 255,100 C 265,80 248,60 256,40 C 260,30 266,24 264,12" 
          fill="none" stroke="url(#slv-crema-grad)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- EMBLEM CENTERED -->
  <g id="slv-emblem" filter="url(#slv-shadow)">
    <!-- Outer Nori Enso Ring -->
    <path d="M 225,70
             A 120,120 0 1,1 125,265
             C 114,250 110,228 112,205
             C 114,145 155,82 225,70 Z" 
          fill="url(#slv-nori-grad)" />

    <!-- Salmon Crown -->
    <path d="M 198,73 C 218,67 240,69 260,76 C 244,83 214,82 198,73 Z"
          fill="url(#slv-salmon-grad)"/>

    <!-- Ceramic Cup Base -->
    <path d="M 142,175 C 142,265 195,318 225,318 C 255,318 308,265 308,175 C 278,187 172,187 142,175 Z" 
          fill="url(#slv-ceramic-grad)" stroke="#EAE2D5" stroke-width="2"/>

    <!-- Saucer Base Line -->
    <path d="M 172,330 C 202,336 248,336 278,330" 
          fill="none" stroke="url(#slv-nori-grad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Cup Handle -->
    <path d="M 302,190 C 331,194 343,224 328,251 C 318,266 305,270 295,270" 
          fill="none" stroke="url(#slv-ceramic-grad)" stroke-width="9.5" stroke-linecap="round"/>

    <!-- Rim & Crema -->
    <ellipse cx="225" cy="180" rx="82" ry="44" fill="#FDFBF7"/>
    <ellipse cx="225" cy="181" rx="74" ry="38" fill="url(#slv-crema-grad)"/>
    <ellipse cx="225" cy="182" rx="65" ry="32" fill="url(#slv-espresso-grad)"/>

    <!-- Salmon & Latte Core -->
    <g id="slv-core-heart">
      <path d="M 225,162 C 252,162 268,185 254,206 C 242,224 225,236 225,236 C 225,236 208,224 196,206 C 182,185 198,162 225,162 Z" 
            fill="url(#slv-salmon-grad)"/>
      <path d="M 213,176 C 220,183 230,183 237,176" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
      <path d="M 206,188 C 218,198 232,198 244,188" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
      <path d="M 225,165 C 227,180 223,198 225,225" fill="none" stroke="#FFF" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 225,159 C 228,150 238,147 241,150 C 243,156 235,162 225,165 Z" fill="url(#slv-matcha-grad)"/>
    </g>
  </g>

  <!-- TEXT SECTION (STACKED & CENTERED) -->
  <g id="slv-typography" text-anchor="middle">
    <!-- Japanese sub-script -->
    <text x="225" y="385" class="japanese-vert" fill="#B08968">鮨 × 珈琲・ラテ</text>

    <!-- Main Title: SUSHI LATTE -->
    <text x="225" y="440" class="brand-title-vert" font-size="46" fill="#1A1D20">SUSHI LATTE</text>

    <!-- Decorative Accent Line with Coral Diamond -->
    <g transform="translate(145, 462)">
      <line x1="0" y1="0" x2="65" y2="0" stroke="#DDB892" stroke-width="1.5"/>
      <polygon points="80,-4 84,0 80,4 76,0" fill="url(#slv-salmon-grad)"/>
      <line x1="95" y1="0" x2="160" y2="0" stroke="#DDB892" stroke-width="1.5"/>
    </g>

    <!-- Subtitle: CRAFT SUSHI & SPECIALTY COFFEE -->
    <text x="225" y="496" class="brand-subtitle-vert" fill="#5F6368">CRAFT SUSHI &amp; SPECIALTY COFFEE</text>

    <!-- Location / Outlets marker -->
    <text x="225" y="525" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#9CA3AF" letter-spacing="0.16em">HORECA SERVICE PLATFORM</text>
  </g>
</svg>
