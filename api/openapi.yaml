        method: { type: string, enum: [cash, qris, card] }
        amount: { type: integer, format: int64, description: Cash — tendered; QRIS and card — amount paid }
        verified: { type: boolean, description: QRIS seen on the merchant app }
    PayResult:
      type: object
      required: [payment, billing]
      properties:
        payment: { $ref: '#/components/schemas/PaymentView' }
        billing: { $ref: '#/components/schemas/Billing' }
    SplitRequest:
      type: object
      required: [method, count]
      properties:
        method: { type: string, enum: [by_item, equal] }
        count: { type: integer, minimum: 2, maximum: 20, description: Number of Sub-bills }
        assign: { type: object, additionalProperties: { type: integer }, description: By item — Order Item id → Sub-bill number }
    ReceiptLine:
      type: object
      required: [quantity, name, modifiers, amount, remake]
      properties:
        quantity: { type: integer }
        name: { type: string }
        variant: { type: string }
        modifiers: { type: array, items: { type: string } }
        amount: { type: integer, format: int64 }
        remake: { type: boolean }
    Receipt:
      type: object
      required: [outlet, copy, reprint, billNumber, tables, openedAt, printedAt, printedBy, customers, lines, totals, payments, balance]
      properties:
        outlet: { type: string }
        copy: { type: string, enum: [customer, internal] }
        reprint: { type: boolean }
        billNumber: { type: string }
        subBill: { type: string, description: "1/2 for a Sub-bill" }
        tables: { type: array, items: { type: string } }
        openedAt: { type: integer, format: int64 }
        closedAt: { type: integer, format: int64 }
        printedAt: { type: integer, format: int64 }
        printedBy: { type: string }
        customers: { type: array, items: { type: string } }
        lines: { type: array, items: { $ref: '#/components/schemas/ReceiptLine' } }
        totals: { $ref: '#/components/schemas/Totals' }
        manualDiscount: { type: string }
        payments: { type: array, items: { $ref: '#/components/schemas/PaymentView' } }
        balance: { type: integer, format: int64 }
    DailySales:
      type: object
      required: [date, bills, totals, rounding, unpaidBills, unpaidTotal, methods, products]
      properties:
        date: { type: string }
        bills: { type: integer }
        totals: { $ref: '#/components/schemas/Totals' }
        rounding: { type: integer, format: int64 }
        unpaidBills: { type: integer }
        unpaidTotal: { type: integer, format: int64 }
        methods:
          type: array
          items:
            type: object
            required: [method, count, amount, pending]
            properties:
              method: { type: string, enum: [cash, qris, card] }
              count: { type: integer }
              amount: { type: integer, format: int64 }
              pending: { type: integer, format: int64 }
        products:
          type: array
          items:
            type: object
            required: [productId, name, quantity, gross]
            properties:
              productId: { type: string }
              name: { type: string }
              quantity: { type: integer }
              gross: { type: integer, format: int64 }
    StaffBill:
      type: object
      required: [id, number, status, type, source, refunded, tables, openedAt, customers, orders, totals, billing]
      properties:
        id: { type: string }
        number: { type: string }
        status: { type: string, enum: [open, settling, closed, unpaid, merged] }
        type: { type: string, enum: [dine_in, takeaway] }
        source: { type: string, enum: [live, post_outage] }
        refunded: { type: integer, format: int64, description: cash Refunds paid on this Bill so far }
        tables: { type: array, items: { $ref: '#/components/schemas/TableRef' } }
        openedAt: { type: integer, format: int64 }
        customers: { type: array, items: { $ref: '#/components/schemas/CustomerDetail' } }
        orders: { type: array, items: { $ref: '#/components/schemas/StaffOrder' } }
        totals: { $ref: '#/components/schemas/Totals' }
        billing: { $ref: '#/components/schemas/Billing' }
    DirectOrderRequest:
      type: object
      required: [items]
      properties:
        tableId: { type: string }
        billId: { type: string }
        customerName: { type: string }
        restrictionTagIds: { type: array, items: { type: string } }
        items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
    CancelReason:
      type: string
      enum: [out_of_stock, customer_request, wrong_order, other]
    CancelRequest:
      type: object
      required: [reason]
      properties:
        reason: { $ref: '#/components/schemas/CancelReason' }
        note: { type: string, description: Required for other }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    OrderChange:
      allOf:
        - $ref: '#/components/schemas/CustomerView'
        - type: object
          required: [orderId]
          properties:
            orderId: { type: string }
    Bilingual:
      type: object
      required: [id, en]
      properties:
        id: { type: string }
        en: { type: string }
    SlideTemplate:
      type: string
      enum: [hero_promo, featured_product, happy_hour, category_spotlight, brand_idle, uploaded]
    Slide:
      type: object
      required: [template, active, headline, subline, imageFocus, categoryIds, steam, durationSeconds]
      properties:
        id: { type: string }
        template: { $ref: '#/components/schemas/SlideTemplate' }
        sort: { type: integer }
        active: { type: boolean }
        headline: { $ref: '#/components/schemas/Bilingual' }
        subline: { $ref: '#/components/schemas/Bilingual' }
        imageKey: { type: string }
        videoKey: { type: string, description: Uploaded template only; imageKey is then the poster }
        imageFocus: { $ref: '#/components/schemas/Focus' }
        productId: { type: string }
        discountId: { type: string }
        categoryIds: { type: array, items: { type: string } }
        steam: { type: boolean }
        durationSeconds: { type: integer }
        activeFrom: { type: integer, format: int64 }
        activeTo: { type: integer, format: int64 }
    DisplayTag:
      type: object
      required: [code, nameId, nameEn]
      properties:
        code: { type: string }
        nameId: { type: string }
        nameEn: { type: string }
    DisplayProduct:
      type: object
      required: [id, nameId, nameEn, descriptionId, descriptionEn, imageFocus, price, priceFrom, soldOut, soldOutVariants, dietaryTags]
      properties:
        id: { type: string }
        nameId: { type: string }
        nameEn: { type: string }
        descriptionId: { type: string }
        descriptionEn: { type: string }
        imageKey: { type: string }
        imageFocus: { $ref: '#/components/schemas/Focus' }
        price: { type: integer, format: int64 }
        priceFrom: { type: boolean }
        soldOut: { type: boolean }
        soldOutVariants: { type: array, items: { $ref: '#/components/schemas/Bilingual' } }
        dietaryTags: { type: array, items: { $ref: '#/components/schemas/DisplayTag' } }
    DisplayDiscount:
      type: object
      required: [name, kind, value, activeNow, startsAt, endsAt, discountedPrice]
      properties:
        name: { type: string }
        kind: { type: string, enum: [percent, nominal] }
        value: { type: integer, format: int64 }
        activeNow: { type: boolean }
        startsAt: { type: integer, format: int64 }
        endsAt: { type: integer, format: int64 }
        discountedPrice: { type: integer, format: int64 }
    PlaylistSlide:
      type: object
      required: [id, template, durationSeconds, headline, subline, imageFocus, steam]
      properties:
        id: { type: string }
        template: { $ref: '#/components/schemas/SlideTemplate' }
        durationSeconds: { type: integer }
        headline: { $ref: '#/components/schemas/Bilingual' }
        subline: { $ref: '#/components/schemas/Bilingual' }
        imageKey: { type: string }
        videoKey: { type: string }
        imageFocus: { $ref: '#/components/schemas/Focus' }
        steam: { type: boolean }
        product: { $ref: '#/components/schemas/DisplayProduct' }
        products: { type: array, items: { $ref: '#/components/schemas/DisplayProduct' } }
        discount: { $ref: '#/components/schemas/DisplayDiscount' }
    Playlist:
      type: object
      required: [generatedAt, slides]
      properties:
        generatedAt: { type: integer, format: int64 }
        slides: { type: array, items: { $ref: '#/components/schemas/PlaylistSlide' } }
    PrepArea:
      type: object
      required: [id, code, nameId, nameEn, parallelCapacity]
      properties:
        id: { type: string }
        code: { type: string }
        nameId: { type: string }
        nameEn: { type: string }
        parallelCapacity: { type: integer }
    Category:
      type: object
      required: [nameId, nameEn, prepAreaId]
      properties:
        id: { type: string }
        nameId: { type: string }
        nameEn: { type: string }
        prepAreaId: { type: string }
        sort: { type: integer }
        active: { type: boolean }
    DietaryTag:
      type: object
      required: [code, nameId, nameEn]
      properties:
        id: { type: string }
        code: { type: string }
        nameId: { type: string }
        nameEn: { type: string }
        icon: { type: string }
        sort: { type: integer }
        active: { type: boolean }
    Focus:
      type: object
      required: [x, y]
      properties:
        x: { type: integer, minimum: 0, maximum: 100 }
        y: { type: integer, minimum: 0, maximum: 100 }
    Variant:
      type: object
      required: [nameId, nameEn, price, isDefault]
      properties:
        id: { type: string, description: Omit to create }
        nameId: { type: string }
        nameEn: { type: string }
        price: { type: integer, format: int64, description: Rupiah excluding tax and service }
        isDefault: { type: boolean }
        sort: { type: integer }
        soldOut: { type: boolean, readOnly: true }
        soldOutAt: { type: integer, format: int64, readOnly: true }
        soldOutSource: { type: string, enum: [manual, cancel_out_of_stock], readOnly: true }
    Modifier:
      type: object
      required: [nameId, nameEn, price, dietaryTagIds]
      properties:
        id: { type: string }
        nameId: { type: string }
        nameEn: { type: string }
        price: { type: integer, format: int64 }
        sort: { type: integer }
        dietaryTagIds: { type: array, items: { type: string }, description: Tags this Modifier adds }
    ModifierGroup:
      type: object
      required: [nameId, nameEn, minSelect, maxSelect, modifiers]
      properties:
        id: { type: string }
        nameId: { type: string }
        nameEn: { type: string }
        minSelect: { type: integer }
        maxSelect: { type: integer }
        sort: { type: integer }
        modifiers: { type: array, items: { $ref: '#/components/schemas/Modifier' } }
    Product:
      type: object
      required: [categoryId, nameId, nameEn, prepTimeSeconds, dietaryTagIds, variants, modifierGroups]
      properties:
        id: { type: string }
        categoryId: { type: string }
        nameId: { type: string }
        nameEn: { type: string }
        descriptionId: { type: string }
        descriptionEn: { type: string }
        imageKey: { type: string }
        imageFocus: { $ref: '#/components/schemas/Focus' }
        prepTimeSeconds: { type: integer }
        status: { type: string, enum: [active, hidden, archived] }
        sort: { type: integer }
        dietaryTagIds: { type: array, items: { type: string } }
        variants: { type: array, items: { $ref: '#/components/schemas/Variant' } }
        modifierGroups: { type: array, items: { $ref: '#/components/schemas/ModifierGroup' } }
    Catalog:
      type: object
      required: [prepAreas, categories, dietaryTags, products]
      properties:
        prepAreas: { type: array, items: { $ref: '#/components/schemas/PrepArea' } }
        categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
        dietaryTags: { type: array, items: { $ref: '#/components/schemas/DietaryTag' } }
        products: { type: array, items: { $ref: '#/components/schemas/Product' } }
    PricingSettings:
      type: object
      required: [serviceRateBp, taxRateBp, priceMode, refundCap]
      properties:
        serviceRateBp: { type: integer, description: Basis points (500 = 5 %) }
        taxRateBp: { type: integer }
        priceMode: { type: string, enum: [exclusive, inclusive] }
        refundCap: { type: integer, format: int64 }
    OpsSettings:
      type: object
      required: [claimRenotifySeconds, claimEscalateSeconds, pickupReminderSeconds, emptyBillCloseSeconds, autoClockOutGraceSeconds]
      properties:
        claimRenotifySeconds: { type: integer }
        claimEscalateSeconds: { type: integer }
        pickupReminderSeconds: { type: integer }
        emptyBillCloseSeconds: { type: integer }
        autoClockOutGraceSeconds: { type: integer }
    Settings:
      type: object
      required: [pricing, ops]
      properties:
        pricing: { $ref: '#/components/schemas/PricingSettings' }
        ops: { $ref: '#/components/schemas/OpsSettings' }
    Discount:
      type: object
      required: [name, kind, value, scope, trigger, daysMask, active, categoryIds, productIds, variantIds]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [percent, nominal] }
        value: { type: integer, format: int64, description: Basis points for percent, Rupiah for nominal }
        scope: { type: string, enum: [item, bill] }
        trigger: { type: string, enum: [auto, manual] }
        daysMask: { type: integer, description: Bit 0 = Monday … bit 6 = Sunday }
        startMinute: { type: integer }
        endMinute: { type: integer }
        validFrom: { type: integer, format: int64 }
        validTo: { type: integer, format: int64 }
        minSubtotal: { type: integer, format: int64 }
        active: { type: boolean }
        categoryIds: { type: array, items: { type: string } }
        productIds: { type: array, items: { type: string } }
        variantIds: { type: array, items: { type: string } }
    Table:
      type: object
      required: [number, label, active]
      properties:
        id: { type: string }
        number: { type: integer }
        label: { type: string }
        qrToken: { type: string, readOnly: true }
        active: { type: boolean }
        qrRegeneratedAt: { type: integer, format: int64, readOnly: true }
    CrewMember:
      type: object
      required: [id, crewId, fullName, role, stations, active]
      properties:
        id: { type: string }
        crewId: { type: string }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        stations: { type: array, items: { $ref: '#/components/schemas/Station' } }
        imageKey: { type: string }
        active: { type: boolean }
        lockedUntil: { type: integer, format: int64 }
    CrewInput:
      type: object
      required: [crewId, fullName, role, stations, active]
      properties:
        crewId: { type: string, pattern: '^[A-Z][0-9]{3}$' }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        stations: { type: array, items: { $ref: '#/components/schemas/Station' } }
        imageKey: { type: string }
        active: { type: boolean }
        pin: { type: string, pattern: '^[0-9]{6}$', description: Required on create }
    AuditEntry:
      type: object
      required: [id, at, action, entity]
      properties:
        id: { type: string }
        at: { type: integer, format: int64 }
        actorId: { type: string }
        approverId: { type: string }
        action: { type: string }
        entity: { type: string }
        entityId: { type: string }
        before: {}
        after: {}
        reason: { type: string }
    Role:
      type: string
      enum: [management, outlet_admin, crew]
    Station:
      type: string
      enum: [waiter, cashier, kitchen]
    Screen:
      type: string
      enum: [kitchen, bar, display, hris]
    OverrideAction:
      type: string
      enum: [manual_discount, void, remake, unpaid_bill, qris_unverified, refund_within_cap, refund_above_cap, demo_reset]
    LoginRequest:
      type: object
      required: [crewId, pin]
      properties:
        crewId: { type: string, example: W001 }
        pin: { type: string, pattern: '^[0-9]{6}$' }
        deviceLabel: { type: string }
    Principal:
      type: object
      required: [crewId, name, role, stations, kind, expiresAt]
      properties:
        crewId: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        stations:
          type: array
          items: { $ref: '#/components/schemas/Station' }
        imageKey: { type: string }
        kind: { type: string, enum: [crew, screen] }
        screen: { $ref: '#/components/schemas/Screen' }
        expiresAt: { type: integer, format: int64, description: UTC Unix milliseconds }
    OverrideRequest:
      type: object
      required: [crewId, pin, action]
      properties:
        crewId: { type: string }
        pin: { type: string, pattern: '^[0-9]{6}$' }
        action: { $ref: '#/components/schemas/OverrideAction' }
    OverrideResponse:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string }
        expiresAt: { type: integer, format: int64 }
    ScreenModeRequest:
      type: object
      required: [screen]
      properties:
        screen: { $ref: '#/components/schemas/Screen' }
        deviceLabel: { type: string }
    DemoAccount:
      type: object
      required: [crewId, name, role, stations, pin, portrait]
      properties:
        crewId: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        stations:
          type: array
          items: { $ref: '#/components/schemas/Station' }
        pin: { type: string }
        portrait: { type: string, description: Source photo under docs/images }
        imageKey: { type: string, description: Processed image key (see /media/images) }
        note: { type: string }
    Problem:
      type: object
      required: [status, code, title]
      properties:
        status: { type: integer }
        code: { type: string }
        title: { type: string }
        detail: { type: string }
        extra:
          type: object
          additionalProperties: true
