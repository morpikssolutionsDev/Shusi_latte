openapi: 3.1.0
info:
  title: Sushi Latte API
  version: 0.1.0
  description: |
    REST API for the Sushi Latte prototype (TRD §6). Errors use RFC 9457 problem details
    with a stable `code`. Mutating requests may carry an `Idempotency-Key` header (TR-API-01).
    Restricted actions require `X-Override-Token` from `POST /auth/override` (TR-API-03).
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      operationId: login
      summary: Sign in with Crew ID and PIN (TR-AUTH-01)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in; sets the `sl_session` cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Principal' }
        '401': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/me:
    get:
      operationId: me
      summary: Current principal
      responses:
        '200':
          description: Signed-in principal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Principal' }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      operationId: logout
      responses:
        '204': { description: Signed out }
  /auth/override:
    post:
      operationId: issueOverride
      summary: Approver enters their PIN for one restricted action (TR-AUTH-06)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OverrideRequest' }
      responses:
        '200':
          description: One-time token valid for 60 seconds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverrideResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
  /auth/screen-mode:
    post:
      operationId: enterScreenMode
      summary: Turn this device into a Kitchen, Bar, Display or HRIS screen (TR-AUTH-08)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScreenModeRequest' }
      responses:
        '200':
          description: Screen-mode principal; replaces the session cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Principal' }
        '403': { $ref: '#/components/responses/Problem' }
  /demo/accounts:
    get:
      operationId: demoAccounts
      summary: Demo logins (Demo mode only)
      responses:
        '200':
          description: Seeded demo Crew with PINs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DemoAccount' }
  # ---------------------------------------------------------------- Phase 1: Admin Panel
  /catalog:
    get:
      operationId: getCatalog
      summary: Full Product catalog (any signed-in staff; TR-PC-05)
      parameters:
        - { name: archived, in: query, schema: { type: boolean }, description: Include Archived Products }
      responses:
        '200': { description: Catalog, content: { application/json: { schema: { $ref: '#/components/schemas/Catalog' } } } }
  /catalog/categories:
    post:
      operationId: createCategory
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /catalog/categories/{id}:
    put:
      operationId: updateCategory
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /catalog/products:
    post:
      operationId: createProduct
      summary: Create a Product with Variants, Modifier groups and Dietary Tags (Management)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /catalog/products/{id}:
    put:
      operationId: updateProduct
      summary: Replace a Product; Variants and Modifiers left out are archived (TR-PC-03)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /catalog/dietary-tags:
    post:
      operationId: createDietaryTag
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DietaryTag' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/DietaryTag' } } } }
  /catalog/dietary-tags/{id}:
    put:
      operationId: updateDietaryTag
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DietaryTag' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/DietaryTag' } } } }
  /catalog/prep-areas/{id}/capacity:
    put:
      operationId: setPrepAreaCapacity
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [parallelCapacity], properties: { parallelCapacity: { type: integer } } }
      responses:
        '204': { description: Saved }
  /catalog/variants/{id}/sold-out:
    put:
      operationId: setSoldOut
      summary: Mark a Variant Sold Out or re-enable it (Outlet Admin, Management; BR-ADM-07)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [soldOut], properties: { soldOut: { type: boolean } } }
      responses:
        '200': { description: Updated Variant, content: { application/json: { schema: { $ref: '#/components/schemas/Variant' } } } }
  /settings:
    get:
      operationId: getSettings
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
  /settings/pricing:
    put:
      operationId: updatePricingSettings
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PricingSettings' } } } }
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /settings/ops:
    put:
      operationId: updateOpsSettings
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OpsSettings' } } } }
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /discounts:
    get:
      operationId: listDiscounts
      responses:
        '200': { description: Discounts, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Discount' } } } } }
    post:
      operationId: createDiscount
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Discount' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Discount' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /discounts/{id}:
    put:
      operationId: updateDiscount
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Discount' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Discount' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /tables:
    get:
      operationId: listTables
      responses:
        '200': { description: Tables, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Table' } } } } }
    post:
      operationId: createTable
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Table' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Table' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /tables/{id}:
    put:
      operationId: updateTable
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Table' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Table' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /tables/{id}/regenerate-qr:
    post:
      operationId: regenerateTableQr
      summary: Issue a new QR token; old printed codes stop working (TR-AUTH-07)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Table, content: { application/json: { schema: { $ref: '#/components/schemas/Table' } } } }
  /crew:
    get:
      operationId: listCrew
      responses:
        '200': { description: Crew, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CrewMember' } } } } }
    post:
      operationId: createCrew
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CrewInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CrewMember' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /crew/{id}:
    put:
      operationId: updateCrew
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CrewInput' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/CrewMember' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /crew/{id}/reset-pin:
    post:
      operationId: resetCrewPin
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [pin], properties: { pin: { type: string, pattern: '^[0-9]{6}$' } } }
      responses:
        '204': { description: PIN reset; lockout cleared; sessions ended }
        '422': { $ref: '#/components/responses/Problem' }
  /images:
    post:
      operationId: uploadImage
      summary: Upload a JPEG, PNG or WebP image (≤ 10 MB); returns its content-addressed key (TR-DM-09)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { type: object, required: [imageKey], properties: { imageKey: { type: string } } }
        '415': { $ref: '#/components/responses/Problem' }
  /videos:
    post:
      operationId: uploadVideo
      summary: Upload an MP4 or WebM video (≤ 40 MB) for an uploaded Product Display slide; stored as-is, content-addressed
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { type: object, required: [videoKey], properties: { videoKey: { type: string, description: 'vid/<hash>.<ext>, served at /media/images/<videoKey>' } } }
        '415': { $ref: '#/components/responses/Problem' }
  /audit:
    get:
      operationId: searchAudit
      summary: Audit log, newest first (Outlet Admin, Management; BR-ADM-12)
      parameters:
        - { name: entity, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string }, description: Action prefix, e.g. variant.sold_out }
        - { name: actor, in: query, schema: { type: string }, description: crew id as actor or approver }
        - { name: from, in: query, schema: { type: integer, format: int64 } }
        - { name: before, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200': { description: Entries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } } } } }
  # ---------------------------------------------------------------- Phase 2: Product Display
  /public/display/playlist:
    get:
      operationId: getPlaylist
      summary: Resolved playlist for the TV (public; unavailable content skipped, BR-PD-03)
      security: []
      responses:
        '200': { description: Playlist, content: { application/json: { schema: { $ref: '#/components/schemas/Playlist' } } } }
  /display/slides:
    get:
      operationId: listSlides
      responses:
        '200': { description: Slides, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Slide' } } } } }
    post:
      operationId: createSlide
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Slide' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Slide' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /display/slides/{id}:
    put:
      operationId: updateSlide
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Slide' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Slide' } } } }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteSlide
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
  /display/slide-order:
    put:
      operationId: reorderSlides
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ids], properties: { ids: { type: array, items: { type: string } } } }
      responses:
        '204': { description: Reordered }
  /demo/tables:
    get:
      operationId: listDemoTables
      summary: Demo launcher cards — every Table with its QR token and scenario (Demo mode only)
      security: []
      responses:
        '200':
          description: Tables
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [number, label, qrToken, active, scenario]
                  properties:
                    number: { type: integer }
                    label: { type: string }
                    qrToken: { type: string }
                    active: { type: boolean }
                    scenario: { type: string }
  # ---------------------------------------------------------------- Phase 3: Client Menu (public)
  /public/tables/{qr}:
    get:
      operationId: lookupTable
      summary: What a QR scan shows — free, occupied with full names, or unavailable (OP-01, BR-CM-12)
      security: []
      parameters: [{ $ref: '#/components/parameters/Qr' }]
      responses:
        '200': { description: Table state, content: { application/json: { schema: { $ref: '#/components/schemas/TableState' } } } }
  /public/tables/{qr}/join:
    post:
      operationId: joinTable
      summary: Open or join the Table's Bill as a new Customer (BR-CM-01, BR-CM-02, TR-DM-01)
      security: []
      parameters: [{ $ref: '#/components/parameters/Qr' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JoinRequest' } } } }
      responses:
        '201': { description: Guest session, content: { application/json: { schema: { $ref: '#/components/schemas/GuestSession' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /public/tables/{qr}/rejoin:
    post:
      operationId: rejoinTable
      summary: Continue as an existing Customer on this device; the previous device is signed out (BR-CM-13)
      security: []
      parameters: [{ $ref: '#/components/parameters/Qr' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [customerId], properties: { customerId: { type: string } } } } }
      responses:
        '200': { description: Guest session, content: { application/json: { schema: { $ref: '#/components/schemas/GuestSession' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /public/tables/{qr}/not-mine:
    post:
      operationId: notMyTable
      summary: '"This isn''t my table" — notifies on-duty Waiters (BR-CM-12)'
      security: []
      parameters: [{ $ref: '#/components/parameters/Qr' }]
      responses:
        '204': { description: Waiters notified }
        '404': { $ref: '#/components/responses/Problem' }
  /public/catalog:
    get:
      operationId: getMenu
      summary: Client Menu catalog — Active Products, Sold Out Variants kept for greying out, current promos (BR-CM-03, BR-CM-04, BR-CM-09)
      security: []
      responses:
        '200': { description: Menu (ETag), content: { application/json: { schema: { $ref: '#/components/schemas/Menu' } } } }
        '304': { description: Not modified }
  /public/bills/me:
    get:
      operationId: getMyBill
      summary: The Customer's Bill, profile and own Orders with status and Estimated Wait (BR-CM-08)
      security: [{ guest: [] }]
      responses:
        '200': { description: View, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerView' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /public/cart/quote:
    post:
      operationId: quoteCart
      summary: Price a cart and report Dietary Warnings and unavailable lines, without saving
      security: [{ guest: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CartItems' } } } }
      responses:
        '200': { description: Quote, content: { application/json: { schema: { $ref: '#/components/schemas/Quote' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /public/orders:
    post:
      operationId: placeOrder
      summary: Place a Pending Order (BR-CM-05, BR-CM-11, TR-DM-02, TR-DM-05). Send an Idempotency-Key.
      security: [{ guest: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CartItems' } } } }
      responses:
        '201': { description: Order placed, content: { application/json: { schema: { $ref: '#/components/schemas/OrderChange' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /public/orders/{id}:
    patch:
      operationId: editOrder
      summary: Edit own Order before Claim — lines left out are Cancelled (Customer Request) (BR-CM-14)
      security: [{ guest: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CartItems' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/OrderChange' } } } }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: cancelOrder
      summary: Cancel own Order before Claim (BR-CM-14)
      security: [{ guest: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/OrderChange' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /public/waiter-calls:
    post:
      operationId: callWaiter
      summary: Call a Waiter; an unanswered call is returned instead of a new one (BR-CM-07)
      security: [{ guest: [] }]
      responses:
        '201': { description: Call, content: { application/json: { schema: { $ref: '#/components/schemas/WaiterCall' } } } }
  # ---------------------------------------------------------------- Phase 4: Waiter
  /waiter/feed:
    get:
      operationId: getWaiterFeed
      summary: Notifications — unclaimed Orders and Waiter calls for everyone, plus the caller's own Orders (BR-WT-01, BR-WT-09)
      responses:
        '200': { description: Feed, content: { application/json: { schema: { $ref: '#/components/schemas/Feed' } } } }
  /floor:
    get:
      operationId: getFloor
      summary: TableMap — every Table with its open Bill
      responses:
        '200': { description: Tables, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TableCard' } } } } }
  /bills/{id}:
    get:
      operationId: getStaffBill
      summary: BillSummary — every Order on the Bill and totals from pricing (BR-WT-07, BR-R-14)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Bill, content: { application/json: { schema: { $ref: '#/components/schemas/StaffBill' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /orders:
    post:
      operationId: directOrder
      summary: Direct entry by a Waiter or Cashier — created Confirmed, opens the Table's Bill if needed (BR-WT-03, OP-04)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DirectOrderRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, required: [orderId], properties: { orderId: { type: string } } } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /orders/{id}/claim:
    post:
      operationId: claimOrder
      summary: Claim a Customer Order; first writer wins, the loser gets 409 already_claimed (TR-SM-03)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Claimed }
        '409': { $ref: '#/components/responses/Problem' }
  /orders/{id}/takeover:
    post:
      operationId: takeoverClaim
      summary: Take over another Waiter's Claim (BR-WT-11, audit-logged)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Taken over }
        '409': { $ref: '#/components/responses/Problem' }
  /orders/{id}/reassign:
    post:
      operationId: reassignClaim
      summary: Outlet Admin or Management reassigns a Claim (BR-R-34, audit-logged)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [toCrewId], properties: { toCrewId: { type: string, description: crew.id } } } } }
      responses:
        '204': { description: Reassigned }
  /orders/{id}/items:
    post:
      operationId: addOrderItems
      summary: Add lines to a Claimed Order before confirming it (OP-03 H3)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CartItems' } } } }
      responses:
        '204': { description: Added }
        '409': { $ref: '#/components/responses/Problem' }
  /orders/{id}/confirm:
    post:
      operationId: confirmOrder
      summary: Confirm a Claimed Order — items go to their Prep Areas; flagged items must be Cancelled first (BR-WT-02, BR-WT-05)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Confirmed }
        '409': { $ref: '#/components/responses/Problem' }
  /order-items/{id}/cancel:
    post:
      operationId: cancelOrderItem
      summary: Cancel a Pending or Confirmed item with a Cancel Reason; Out of Stock marks the Variant Sold Out (BR-WT-04, TR-SM-04)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CancelRequest' } } } }
      responses:
        '204': { description: Cancelled }
        '409': { $ref: '#/components/responses/Problem' }
  /order-items/serve:
    post:
      operationId: serveItems
      summary: Mark Ready items Served (BR-WT-09)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [itemIds], properties: { itemIds: { type: array, items: { type: string } } } } } }
      responses:
        '204': { description: Served }
        '409': { $ref: '#/components/responses/Problem' }
  /order-items/{id}/remake:
    post:
      operationId: remakeItem
      summary: No-charge Remake of a Served item; needs X-Override-Token for action remake (BR-R-33)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses:
        '201': { description: Remake created, content: { application/json: { schema: { type: object, required: [itemId], properties: { itemId: { type: string } } } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /order-items/{id}/void:
    post:
      operationId: voidItem
      summary: Void a Ready or Served item on an unpaid Bill; needs X-Override-Token for action void (BR-R-08)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses:
        '204': { description: Voided }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /waiter-calls/{id}/answer:
    post:
      operationId: answerWaiterCall
      summary: Mark a Waiter call handled
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Answered }
        '409': { $ref: '#/components/responses/Problem' }
  # ---------------------------------------------------------------- Phase 4: Bills and payment
  /bills/{id}/billing:
    get:
      operationId: getBilling
      summary: Totals, Sub-bill shares, Payments and balance (TR-PR-01, TR-PR-04)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Billing, content: { application/json: { schema: { $ref: '#/components/schemas/Billing' } } } }
  /bills/{id}/settle:
    post:
      operationId: settleBill
      summary: Bill → Settling; Customer ordering blocked, price fixed (BR-R-27)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Settling }
  /bills/{id}/unlock:
    post:
      operationId: unlockBill
      summary: Settling → Open, accepting Customer Orders again (BR-WT-15)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Open }
  /bills/{id}/discount:
    post:
      operationId: applyManualDiscount
      summary: Manual Bill discount; needs X-Override-Token for action manual_discount (BR-R-17)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [discountId], properties: { discountId: { type: string } } } } }
      responses:
        '204': { description: Applied }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /bills/{id}/payments:
    post:
      operationId: recordPayment
      summary: Record a Payment; cash rounds to Rp 100 at the final payment; unverified QRIS needs X-Override-Token qris_unverified (BR-R-18, BR-R-19, BR-R-30)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PayRequest' } } } }
      responses:
        '201': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/PayResult' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /bills/{id}/close:
    post:
      operationId: closeBill
      summary: Close a fully paid Bill or Sub-bill; unfinished items need payNowServeLater (BR-R-31)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { subBillId: { type: string }, payNowServeLater: { type: boolean } } }
      responses:
        '204': { description: Closed }
        '409': { $ref: '#/components/responses/Problem' }
  /bills/{id}/unpaid:
    post:
      operationId: closeUnpaid
      summary: Close as Unpaid Bill; needs X-Override-Token for action unpaid_bill and a reason (BR-R-32)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses:
        '204': { description: Closed unpaid }
        '403': { $ref: '#/components/responses/Problem' }
  /bills/{id}/move:
    post:
      operationId: moveBill
      summary: Move a Bill to a free Table; an occupied target returns 409 table_occupied (BR-R-28)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [toTableId], properties: { fromTableId: { type: string }, toTableId: { type: string } } }
      responses:
        '204': { description: Moved }
        '409': { $ref: '#/components/responses/Problem' }
  /bills/merge:
    post:
      operationId: mergeBills
      summary: Merge Bills into one; irreversible (BR-R-03, TR-DM-03)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [intoBillId, billIds], properties: { intoBillId: { type: string }, billIds: { type: array, items: { type: string } } } }
      responses:
        '204': { description: Merged }
        '409': { $ref: '#/components/responses/Problem' }
  /bills/{id}/split:
    post:
      operationId: splitBill
      summary: Split into Sub-bills by item or equally, before any Payment (BR-R-04, BR-R-29)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SplitRequest' } } } }
      responses:
        '204': { description: Split }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /bills/{id}/receipts:
    post:
      operationId: printReceipt
      summary: Receipt content for one copy; records the print, later prints are REPRINT and audited (TR-PRN-05, TR-PRN-08)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [copy], properties: { copy: { type: string, enum: [customer, internal] }, subBillId: { type: string } } }
      responses:
        '201': { description: Receipt, content: { application/json: { schema: { $ref: '#/components/schemas/Receipt' } } } }
  /reports/daily-sales:
    get:
      operationId: getDailySales
      summary: Daily sales for one business day (04:00–04:00 WIB) from frozen Bill totals (BR-ADM-11)
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: format, in: query, required: false, description: csv for a spreadsheet download, schema: { type: string, enum: [json, csv] } }
      responses:
        '200': { description: Report, content: { application/json: { schema: { $ref: '#/components/schemas/DailySales' } } } }
  # ---------------------------------------------------------------- Phase 5: Kitchen
  /prep-areas/{id}/queue:
    get:
      operationId: getKitchenQueue
      summary: Prep Area display — tickets of Confirmed and Preparing items (Remakes first) and Ready items waiting pickup (BR-KT-01, TR-KT-01)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Queue, content: { application/json: { schema: { $ref: '#/components/schemas/KitchenQueue' } } } }
  /order-items/start:
    post:
      operationId: startItems
      summary: Confirmed → Preparing (BR-KT-03)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ItemIds' } } } }
      responses:
        '204': { description: Started }
        '409': { $ref: '#/components/responses/Problem' }
  /order-items/ready:
    post:
      operationId: readyItems
      summary: Preparing → Ready; the owning Waiter is signalled (BR-KT-03, BR-WT-09)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ItemIds' } } } }
      responses:
        '204': { description: Ready }
        '409': { $ref: '#/components/responses/Problem' }
  /order-items/{id}/kitchen-cancel:
    post:
      operationId: kitchenCancelItem
      summary: Kitchen Cancel of a Confirmed or Preparing item; Out of Stock marks the Variant Sold Out (BR-KT-04, G-07)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CancelRequest' } } } }
      responses:
        '204': { description: Cancelled }
        '409': { $ref: '#/components/responses/Problem' }
  /reports/prep-time:
    get:
      operationId: getPrepTimeReport
      summary: Share of items Ready within their Prep Time, by Prep Area and Product (TR-KT-05)
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: format, in: query, required: false, description: csv for a spreadsheet download, schema: { type: string, enum: [json, csv] } }
      responses:
        '200': { description: Report, content: { application/json: { schema: { $ref: '#/components/schemas/PrepReport' } } } }
  # ---------------------------------------------------------------- Phase 6: Cashier
  /cashier/bills:
    get:
      operationId: getCashierBills
      summary: Open Bills (Tables and Takeaway) and those closed this business day
      responses:
        '200': { description: Bills, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BillBrief' } } } } }
  /drawer:
    get:
      operationId: getDrawer
      summary: Cash Drawer — open session, expected cash (TR-PAY-01), Handovers, Refunds, held cash and pending QRIS
      responses:
        '200': { description: Drawer, content: { application/json: { schema: { $ref: '#/components/schemas/Drawer' } } } }
  /drawer-sessions:
    post:
      operationId: openDrawer
      summary: Open the drawer with the Opening Float (BR-CS-04)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [openingFloat], properties: { openingFloat: { type: integer, format: int64 } } } } }
      responses:
        '204': { description: Opened }
        '409': { $ref: '#/components/responses/Problem' }
  /drawer-sessions/current/close:
    post:
      operationId: closeDrawer
      summary: Shift Closing — refused while QRIS is pending (BR-CS-06, BR-CS-07, TR-PAY-03)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [countedCash], properties: { countedCash: { type: integer, format: int64 } } } } }
      responses:
        '200': { description: Shift Closing, content: { application/json: { schema: { $ref: '#/components/schemas/ShiftClosing' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /cash-handovers:
    post:
      operationId: receiveHandover
      summary: Cash Handover from a Waiter; the difference is recorded against them (BR-CS-05, TR-PAY-02)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [waiterId, receivedAmount], properties: { waiterId: { type: string, description: crew.id }, receivedAmount: { type: integer, format: int64 } } }
      responses:
        '201': { description: Received, content: { application/json: { schema: { $ref: '#/components/schemas/HandoverView' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /crew/{id}/held-cash:
    get:
      operationId: getHeldCash
      summary: Cash a Waiter still holds (BR-WT-14)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Held cash, content: { application/json: { schema: { $ref: '#/components/schemas/HeldCash' } } } }
  /payments/{id}/verify:
    post:
      operationId: verifyPayment
      summary: Verify a pending QRIS (BR-R-30)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Verified }
        '409': { $ref: '#/components/responses/Problem' }
  /payments/{id}/write-off:
    post:
      operationId: writeOffPayment
      summary: Write off a pending QRIS with a reason (BR-CS-07)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses:
        '204': { description: Written off }
  /bills/{id}/refunds:
    post:
      operationId: refundBill
      summary: Cash Refund on a closed Bill; X-Override-Token refund_within_cap or refund_above_cap (BR-R-20, BR-CS-03)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [amount, reason], properties: { amount: { type: integer, format: int64 }, reason: { type: string } } }
      responses:
        '204': { description: Refunded }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /bills:
    post:
      operationId: openTakeaway
      summary: Open a Takeaway Bill; its Order reaches the Kitchen only once paid in full (BR-CS-02, TR-PAY-04)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TakeawayRequest' } } } }
      responses:
        '201': { description: Opened, content: { application/json: { schema: { type: object, required: [billId], properties: { billId: { type: string } } } } } }
  /post-outage/bills:
    post:
      operationId: postOutageEntry
      summary: Re-enter a paper Bill after an outage; skips the Kitchen, marked post_outage (BR-CS-08)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OutageRequest' } } } }
      responses:
        '201': { description: Entered, content: { application/json: { schema: { type: object, required: [billId], properties: { billId: { type: string } } } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /reports/bills:
    get:
      operationId: getBillHistory
      summary: Bills closed in a business day with Customer names, or "Customer" once Anonymised (TR-RET-01, G-24)
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: format, in: query, required: false, description: csv for a spreadsheet download, schema: { type: string, enum: [json, csv] } }
      responses:
        '200': { description: Bills, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryRow' } } } } }
  /reports/operations:
    get:
      operationId: getOperationsReport
      summary: Shift Closings, Unpaid Bills, Remakes, Refunds and Post-outage Entries for a business day (BR-ADM-11)
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: format, in: query, required: false, description: csv for a spreadsheet download, schema: { type: string, enum: [json, csv] } }
      responses:
        '200': { description: Report, content: { application/json: { schema: { $ref: '#/components/schemas/Operations' } } } }
  # ---------------------------------------------------------------- Phase 7: HRIS
  /attendance/clock:
    post:
      operationId: clock
      summary: Clock in, or out when already in — HRIS screen-mode session only (BR-HR-03, TR-AUTH-08); clock-out refused while holding cash (BR-HR-07) and asks to acknowledge open Claims (G-06)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClockRequest' } } } }
      responses:
        '200': { description: Clocked, content: { application/json: { schema: { $ref: '#/components/schemas/ClockResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { description: "cash_held (extra.amount) or open_claims (extra.claims)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '423': { $ref: '#/components/responses/Problem' }
  /attendance:
    get:
      operationId: listAttendance
      summary: Shifts and attendance per Crew member and day, with leave (Outlet Admin, Management)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Rows, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AttendanceRow' } } } } }
  /attendance/{id}/correct:
    post:
      operationId: correctAttendance
      summary: Correct clock times with a reason; audit-logged (BR-HR-06)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CorrectAttendanceRequest' } } } }
      responses:
        '204': { description: Corrected }
        '422': { $ref: '#/components/responses/Problem' }
  /attendance/export:
    get:
      operationId: exportAttendance
      summary: Attendance CSV for external payroll (BR-HR-05, Management)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: CSV, content: { text/csv: { schema: { type: string } } } }
  /shifts:
    get:
      operationId: listShifts
      summary: Shift schedule with approved leave (any Crew member)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Schedule, content: { application/json: { schema: { $ref: '#/components/schemas/Schedule' } } } }
    post:
      operationId: createShift
      summary: Schedule a shift (BR-HR-02, Outlet Admin, Management)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShiftRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /shifts/{id}:
    put:
      operationId: updateShift
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShiftRequest' } } } }
      responses:
        '204': { description: Updated }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteShift
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Problem' }
  /leave-requests:
    get:
      operationId: listLeave
      summary: Every request for Outlet Admin and Management; a Crew member's own otherwise
      responses:
        '200': { description: Requests, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LeaveView' } } } } }
    post:
      operationId: requestLeave
      summary: Request leave (BR-HR-04)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LeaveRequest' } } } }
      responses:
        '201': { description: Requested, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /leave-requests/{id}/decision:
    post:
      operationId: decideLeave
      summary: Approve or reject (with reason) a pending request; not one's own (BR-HR-04)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [approve], properties: { approve: { type: boolean }, reason: { type: string } } } } }
      responses:
        '204': { description: Decided }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /employees:
    get:
      operationId: listEmployees
      summary: Employee records (BR-HR-01, Management)
      responses:
        '200': { description: Employees, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Employee' } } } } }
  /employees/{id}:
    put:
      operationId: saveEmployee
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmployeeRequest' } } } }
      responses:
        '204': { description: Saved }
        '422': { $ref: '#/components/responses/Problem' }
  /hris/me:
    get:
      operationId: hrisMe
      summary: The caller's open attendance, shifts for the next 14 days, leave and held cash
      responses:
        '200': { description: Me, content: { application/json: { schema: { $ref: '#/components/schemas/HrisMe' } } } }
  # ---------------------------------------------------------------- Phase 8: demo reset
  /demo/reset:
    post:
      operationId: resetDemo
      summary: Rebuild the demo at T0 = now (Demo mode, Management + X-Override-Token demo_reset); answers at once and resets in the background, announced on the public `demo` topic (DEMO-AND-SEED §9)
      responses:
        '202': { description: Reset started, content: { application/json: { schema: { type: object, required: [status, at], properties: { status: { type: string }, at: { type: integer, format: int64 } } } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    guest:
      type: apiKey
      in: header
      name: X-Guest-Token
      description: Customer guest token from join/rejoin; WebSocket clients pass it as ?guest=
  parameters:
    Qr:
      name: qr
      in: path
      required: true
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Problem:
      description: Problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    TableRef:
      type: object
      required: [number, label]
      properties:
        number: { type: integer }
        label: { type: string }
    CustomerRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    TableState:
      type: object
      required: [state, settling, customers]
      properties:
        state: { type: string, enum: [free, occupied, unavailable] }
        table: { $ref: '#/components/schemas/TableRef' }
        settling: { type: boolean }
        customers: { type: array, items: { $ref: '#/components/schemas/CustomerRef' } }
    JoinRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 40 }
        restrictionTagIds: { type: array, items: { type: string } }
        dietaryNote: { type: string, maxLength: 300 }
        consent: { type: boolean, description: Without consent the restriction and note are discarded (BR-CM-02) }
    GuestSession:
      type: object
      required: [token, customerId, billId, name, firstScan]
      properties:
        token: { type: string }
        customerId: { type: string }
        billId: { type: string }
        name: { type: string }
        firstScan: { type: boolean, description: This scan opened the Bill (plays the splash, MOTION M1) }
    Promo:
      type: object
      required: [discountId, name, price]
      properties:
        discountId: { type: string }
        name: { type: string }
        price: { type: integer, format: int64 }
    Menu:
      type: object
      required: [categories, dietaryTags, products, promos, priceMode, taxRateBp, serviceRateBp]
