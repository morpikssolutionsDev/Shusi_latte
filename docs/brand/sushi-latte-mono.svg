<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" style="color:#000" aria-labelledby="title">
  <title id="title">Sushi Latte</title>

  <!-- ART START -->
  <!-- Badge -->
  <circle class="a badge" cx="200" cy="200" r="184" fill="#FFFFFF" stroke="currentColor" stroke-width="8"/>
  <circle class="ring" cx="200" cy="200" r="168" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="0 13.89"/>

  <!-- Decorations: coffee beans, black sesame, sparkles -->
  <g transform="translate(84 142) rotate(-30)">
    <g class="a bean">
      <ellipse rx="11" ry="15" fill="currentColor"/>
      <path d="M1 -13C-6 -5 6 5 -1 13" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </g>
  <g transform="translate(318 126) rotate(28)">
    <g class="a bean b2">
      <ellipse rx="10" ry="14" fill="currentColor"/>
      <path d="M1 -12C-6 -4 6 4 -1 12" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </g>
  <g transform="translate(76 252) rotate(15)">
    <g class="a bean b3">
      <ellipse rx="9" ry="12.5" fill="currentColor"/>
      <path d="M1 -11C-5 -4 5 4 -1 11" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </g>
  <g fill="currentColor">
    <g transform="translate(116 96) rotate(-35)"><ellipse class="a seed" rx="3" ry="5.5"/></g>
    <g transform="translate(130 82) rotate(20)"><ellipse class="a seed d2" rx="2.6" ry="5"/></g>
    <g transform="translate(150 344) rotate(60)"><ellipse class="a seed d3" rx="3" ry="5.5"/></g>
    <g transform="translate(252 346) rotate(-50)"><ellipse class="a seed d4" rx="3" ry="5.5"/></g>
  </g>
  <g fill="currentColor">
    <g transform="translate(278 74)"><path class="a sparkle" d="M0 -12C2 -3 3 -2 12 0C3 2 2 3 0 12C-2 3 -3 2 -12 0C-3 -2 -2 -3 0 -12Z"/></g>
    <g transform="translate(320 300)"><path class="a sparkle k2" d="M0 -10C2 -3 3 -2 10 0C3 2 2 3 0 10C-2 3 -3 2 -10 0C-3 -2 -2 -3 0 -10Z"/></g>
    <g transform="translate(106 318)"><path class="a sparkle k3" d="M0 -9C2 -2 2 -2 9 0C2 2 2 2 0 9C-2 2 -2 2 -9 0C-2 -2 -2 -2 0 -9Z"/></g>
  </g>

  <!-- Steam -->
  <g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round">
    <path class="steam s1" d="M168 126C156 110 180 98 168 82C158 70 174 60 168 50"/>
    <path class="steam s2" d="M200 120C188 104 212 92 200 76C190 64 206 54 200 44"/>
    <path class="steam s3" d="M232 126C220 110 244 98 232 82C222 70 238 60 232 50"/>
  </g>

  <!-- Latte cup on saucer -->
  <g class="cup">
    <ellipse cx="200" cy="304" rx="118" ry="16" fill="currentColor"/>
    <ellipse cx="200" cy="300" rx="84" ry="8" fill="#FFFFFF"/>
    <path d="M282 220C326 216 330 276 272 270" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"/>
    <path d="M114 198H286L273 266Q267 294 238 294H162Q133 294 127 266Z" fill="currentColor"/>
    <path d="M119.4 226H280.6L278 240H122Z" fill="currentColor"/>
    <g fill="#FFFFFF">
      <circle cx="140" cy="233" r="2.4"/><circle cx="160" cy="233" r="2.4"/><circle cx="180" cy="233" r="2.4"/>
      <circle cx="200" cy="233" r="2.4"/><circle cx="220" cy="233" r="2.4"/><circle cx="240" cy="233" r="2.4"/>
      <circle cx="260" cy="233" r="2.4"/>
    </g>
    <path d="M140 252Q146 276 166 280" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="200" cy="198" rx="86" ry="13" fill="#FFFFFF"/>
    <ellipse cx="200" cy="199" rx="78" ry="9.5" fill="currentColor"/>
  </g>

  <!-- Salmon nigiri resting on the cup -->
  <g class="nigiri">
    <rect x="136" y="158" width="128" height="46" rx="23" fill="#FFFFFF" stroke="currentColor" stroke-width="2"/>
    <g fill="#FFFFFF">
      <ellipse cx="152" cy="192" rx="4" ry="2" transform="rotate(-15 152 192)"/>
      <ellipse cx="170" cy="197" rx="4" ry="2" transform="rotate(10 170 197)"/>
      <ellipse cx="232" cy="196" rx="4" ry="2" transform="rotate(-10 232 196)"/>
      <ellipse cx="250" cy="190" rx="4" ry="2" transform="rotate(20 250 190)"/>
    </g>
    <path d="M130 172C134 146 176 138 204 138C238 138 270 146 272 166C273 176 262 180 250 176C230 170 172 170 150 178C138 182 128 182 130 172Z" fill="currentColor"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round">
      <path d="M158 150C164 158 166 166 162 174"/>
      <path d="M180 143C186 152 188 162 184 171"/>
      <path d="M224 142C230 151 232 161 228 170"/>
      <path d="M250 148C255 156 257 163 254 171"/>
    </g>
    <path d="M148 154C172 144 226 142 256 150" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <rect x="190" y="136" width="20" height="70" rx="3" fill="currentColor"/>
    <path d="M195 142V200" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- ART END -->
</svg>
