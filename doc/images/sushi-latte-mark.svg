<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" id="sushi-latte-brandmark" class="sushi-latte-vector">
  <defs>
    <!-- Background subtle radial glow (toggleable) -->
    <radialGradient id="sl-bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF5EE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FAF5EE" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Latte Crema Gradient -->
    <linearGradient id="sl-crema-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED9C4"/>
      <stop offset="50%" stop-color="#DDB892"/>
      <stop offset="100%" stop-color="#B08968"/>
    </linearGradient>

    <!-- Rich Espresso Coffee Gradient -->
    <linearGradient id="sl-espresso-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F4E37"/>
      <stop offset="100%" stop-color="#3D261A"/>
    </linearGradient>

    <!-- Premium Fresh Salmon Gradient -->
    <linearGradient id="sl-salmon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A65"/>
      <stop offset="60%" stop-color="#F4511E"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>

    <!-- Nori Charcoal Gradient -->
    <linearGradient id="sl-nori-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3134"/>
      <stop offset="100%" stop-color="#141618"/>
    </linearGradient>

    <!-- Ceramic Warm Cup Gradient -->
    <linearGradient id="sl-ceramic-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFE8DD"/>
    </linearGradient>

    <!-- Matcha Accent Gradient -->
    <linearGradient id="sl-matcha-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81A263"/>
      <stop offset="100%" stop-color="#4C6B38"/>
    </linearGradient>

    <!-- Drop Shadows for depth -->
    <filter id="sl-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1A1512" flood-opacity="0.14"/>
    </filter>
    <filter id="sl-soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1A1512" flood-opacity="0.08"/>
    </filter>

    <style>
      .sushi-latte-vector {
        overflow: visible;
      }
      /* Interactive classes ready for Framer Motion or CSS */
      #sl-steam-paths path {
        transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
        transform-origin: 250px 140px;
      }
      #sushi-latte-brandmark:hover #sl-steam-paths path:nth-child(1) {
        transform: translateY(-8px) scaleY(1.15);
        opacity: 0.95;
      }
      #sushi-latte-brandmark:hover #sl-steam-paths path:nth-child(2) {
        transform: translateY(-12px) scaleY(1.2);
        opacity: 1;
      }
      #sushi-latte-brandmark:hover #sl-steam-paths path:nth-child(3) {
        transform: translateY(-7px) scaleY(1.12);
        opacity: 0.9;
      }
      #sl-core-heart {
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        transform-origin: 250px 290px;
      }
      #sushi-latte-brandmark:hover #sl-core-heart {
        transform: scale(1.08);
      }
      #sl-enso-ring {
        transition: stroke-dashoffset 0.8s ease, transform 0.5s ease;
        transform-origin: 250px 280px;
      }
      #sushi-latte-brandmark:hover #sl-enso-ring {
        transform: rotate(6deg);
      }
    </style>
  </defs>

  <!-- Ambient Glow Background -->
  <circle id="sl-ambient-bg" cx="250" cy="270" r="210" fill="url(#sl-bg-glow)"/>

  <!-- STEAM VAPOR / AROMA (Top interaction layer) -->
  <g id="sl-steam-paths" opacity="0.85">
    <!-- Left Steam Wisp -->
    <path id="sl-steam-1" d="M215,160 C205,135 225,110 215,85 C210,72 202,65 204,50" 
          fill="none" stroke="url(#sl-crema-grad)" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Center Steam Wisp (Tallest, dynamic S-curve) -->
    <path id="sl-steam-2" d="M250,150 C240,120 265,95 252,65 C245,48 252,38 250,25" 
          fill="none" stroke="url(#sl-salmon-grad)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Right Steam Wisp -->
    <path id="sl-steam-3" d="M285,160 C295,135 275,110 285,85 C290,72 298,65 296,50" 
          fill="none" stroke="url(#sl-crema-grad)" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- MAIN EMBLEM: ENSO CIRCLE + SUSHI ROLL + CERAMIC CUP FUSION -->
  <g id="sl-main-emblem" filter="url(#sl-shadow)">

    <!-- Layer 1: Zen Enso / Outer Nori Ring -->
    <!-- Japanese brushwork geometry evoking both a precision cut nori sheet and the endless Zen Enso circle -->
    <path id="sl-enso-ring" d="M 250,100
             A 160,160 0 1,1 120,360
             C 105,340 100,310 102,280
             C 105,200 160,115 250,100 Z" 
          fill="url(#sl-nori-grad)" />

    <!-- Accent Sashimi Ribbon on Enso Crown (Salmon & Gold) -->
    <path id="sl-nori-accent" d="M 215,103 
             C 240,96 270,98 295,107
             C 275,116 235,114 215,103 Z"
          fill="url(#sl-salmon-grad)"/>

    <!-- Layer 2: Ceramic Latte Cup Base (Warm White Porcelain) -->
    <!-- Elegantly cradles the lower half like a Japanese ceramic chawan / specialty cappuccino cup -->
    <path id="sl-cup-vessel" d="M 140,240 
             C 140,360 210,430 250,430 
             C 290,430 360,360 360,240 
             C 320,255 180,255 140,240 Z" 
          fill="url(#sl-ceramic-grad)" 
          stroke="#EDE6DA" stroke-width="2"/>

    <!-- Saucer / Plate Minimalist Base Line -->
    <path id="sl-saucer-base" d="M 180,446 C 220,454 280,454 320,446" 
          fill="none" stroke="url(#sl-nori-grad)" stroke-width="7" stroke-linecap="round"/>

    <!-- Subtle Ceramic Cup Handle (Geometric Minimalist) -->
    <path id="sl-cup-handle" d="M 352,260 C 390,265 405,305 385,340 C 372,360 355,365 342,365" 
          fill="none" stroke="url(#sl-ceramic-grad)" stroke-width="12" stroke-linecap="round"
          filter="url(#sl-soft-shadow)"/>
    <path id="sl-cup-handle-inner" d="M 352,260 C 390,265 405,305 385,340 C 372,360 355,365 342,365" 
          fill="none" stroke="#D4C9BC" stroke-width="3" stroke-linecap="round"/>

    <!-- Layer 3: The Sushi Rice Rim & Latte Crema Surface (The Round Fusion Horizon) -->
    <ellipse id="sl-surface-rim" cx="250" cy="245" rx="108" ry="58" fill="#FBF9F5"/>
    <ellipse id="sl-crema-pool" cx="250" cy="246" rx="98" ry="50" fill="url(#sl-crema-grad)"/>
    <ellipse id="sl-espresso-pool" cx="250" cy="248" rx="86" ry="42" fill="url(#sl-espresso-grad)"/>

    <!-- Rice Texture Dots (Subtle Japanese rice grains around rim) -->
    <g id="sl-rice-grains" fill="#FFFFFF" opacity="0.85">
      <ellipse cx="165" cy="240" rx="4" ry="2.5" transform="rotate(-15 165 240)"/>
      <ellipse cx="185" cy="265" rx="4" ry="2.5" transform="rotate(25 185 265)"/>
      <ellipse cx="215" cy="285" rx="4.5" ry="2.5" transform="rotate(10 215 285)"/>
      <ellipse cx="285" cy="285" rx="4.5" ry="2.5" transform="rotate(-10 285 285)"/>
      <ellipse cx="315" cy="265" rx="4" ry="2.5" transform="rotate(-25 315 265)"/>
      <ellipse cx="335" cy="240" rx="4" ry="2.5" transform="rotate(15 335 240)"/>
    </g>

    <!-- Layer 4: The Core Heart (Hybrid of Salmon Sashimi Nigiri Cross-Section & Latte Art Rosetta Leaf / Coffee Bean) -->
    <g id="sl-core-heart">
      <!-- Fresh Salmon Center Flesh -->
      <path id="sl-salmon-core" d="M 250,220 
               C 285,220 305,250 288,278 
               C 272,302 250,318 250,318 
               C 250,318 228,302 212,278 
               C 195,250 215,220 250,220 Z" 
            fill="url(#sl-salmon-grad)"/>

      <!-- Delicate Salmon Marbling / Latte Art Tulips (White Crema Lines) -->
      <path d="M 235,238 C 245,248 255,248 265,238" fill="none" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
      <path d="M 226,254 C 242,268 258,268 274,254" fill="none" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
      <path d="M 224,272 C 240,286 260,286 276,272" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

      <!-- Central Coffee Bean Seam / Stem of Latte Art (S-curve spine) -->
      <path id="sl-latte-spine" d="M 250,223 C 253,245 247,270 250,305" 
            fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

      <!-- Delicate Green Matcha Accent Leaf (Garnish / Wasabi Leaf Touch) -->
      <path id="sl-matcha-leaf" d="M 250,216 C 255,204 268,200 272,204 C 274,213 263,220 250,224 Z" 
            fill="url(#sl-matcha-grad)"/>
    </g>

    <!-- Layer 5: Pair of Sleek Modern Chopsticks resting at angle across rim (Subtle Graphic Touch) -->
    <g id="sl-chopsticks" opacity="0.9">
      <!-- Chopstick 1 -->
      <path d="M 125,185 L 295,348" stroke="#DDB892" stroke-width="4" stroke-linecap="round"/>
      <path d="M 125,185 L 175,233" stroke="#2D3134" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Chopstick 2 -->
      <path d="M 140,175 L 308,336" stroke="#C89666" stroke-width="4" stroke-linecap="round"/>
      <path d="M 140,175 L 190,223" stroke="#2D3134" stroke-width="4.5" stroke-linecap="round"/>
    </g>

  </g>
</svg>
