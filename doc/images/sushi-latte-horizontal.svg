<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="100%" id="sushi-latte-logo-horizontal" class="sushi-latte-vector">
  <defs>
    <!-- Warm Latte Crema Gradient -->
    <linearGradient id="slh-crema-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED9C4"/>
      <stop offset="50%" stop-color="#DDB892"/>
      <stop offset="100%" stop-color="#B08968"/>
    </linearGradient>

    <!-- Rich Espresso Coffee Gradient -->
    <linearGradient id="slh-espresso-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C3D2E"/>
      <stop offset="100%" stop-color="#2D1A12"/>
    </linearGradient>

    <!-- Premium Fresh Salmon Gradient -->
    <linearGradient id="slh-salmon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A65"/>
      <stop offset="60%" stop-color="#F4511E"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>

    <!-- Nori Charcoal Gradient -->
    <linearGradient id="slh-nori-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3134"/>
      <stop offset="100%" stop-color="#141618"/>
    </linearGradient>

    <!-- Ceramic Warm White Gradient -->
    <linearGradient id="slh-ceramic-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFE8DD"/>
    </linearGradient>

    <!-- Matcha Accent Gradient -->
    <linearGradient id="slh-matcha-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81A263"/>
      <stop offset="100%" stop-color="#4C6B38"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="slh-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1A1512" flood-opacity="0.12"/>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap');
      .brand-title {
        font-family: 'Cinzel', 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-weight: 700;
        letter-spacing: 0.18em;
      }
      .brand-subtitle {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-weight: 600;
        letter-spacing: 0.28em;
        font-size: 13px;
        text-transform: uppercase;
      }
      .japanese-sub {
        font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
        font-size: 14px;
        letter-spacing: 0.35em;
      }
      /* Hover interactions */
      #sushi-latte-logo-horizontal:hover #slh-steam-group path {
        transform: translateY(-5px);
        transition: transform 0.4s ease;
      }
      #sushi-latte-logo-horizontal:hover #slh-core-heart {
        transform: scale(1.06);
        transition: transform 0.3s ease;
      }
    </style>
  </defs>

  <!-- LOGO EMBLEM ON LEFT (Centered at X: 110, Y: 110) -->
  <g id="slh-mark-wrapper" transform="translate(10, 5)">
    <!-- STEAM VAPOR -->
    <g id="slh-steam-group" opacity="0.8">
      <path d="M 85,62 C 80,48 92,36 86,22 C 83,16 78,12 80,4" 
            fill="none" stroke="url(#slh-crema-grad)" stroke-width="3" stroke-linecap="round"/>
      <path d="M 105,56 C 100,40 114,28 106,12 C 102,4 106,-1 105,-8" 
            fill="none" stroke="url(#slh-salmon-grad)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 125,62 C 130,48 118,36 124,22 C 127,16 132,12 130,4" 
            fill="none" stroke="url(#slh-crema-grad)" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Main Emblem Group -->
    <g id="slh-emblem" filter="url(#slh-shadow)">
      <!-- Outer Nori Enso Ring -->
      <path d="M 105,42
               A 78,78 0 1,1 42,168
               C 34,158 32,144 33,129
               C 34,90 61,50 105,42 Z" 
            fill="url(#slh-nori-grad)" />

      <!-- Salmon Crown -->
      <path d="M 88,44 C 100,40 115,41 127,45 C 117,50 98,49 88,44 Z"
            fill="url(#slh-salmon-grad)"/>

      <!-- Ceramic Cup Base -->
      <path d="M 52,110 C 52,170 85,204 105,204 C 125,204 158,170 158,110 C 138,118 72,118 52,110 Z" 
            fill="url(#slh-ceramic-grad)" stroke="#E8E0D2" stroke-width="1.5"/>

      <!-- Saucer Base Line -->
      <path d="M 72,212 C 92,216 118,216 138,212" 
            fill="none" stroke="url(#slh-nori-grad)" stroke-width="4" stroke-linecap="round"/>

      <!-- Cup Handle -->
      <path d="M 154,120 C 173,122 181,142 171,159 C 165,169 156,171 150,171" 
            fill="none" stroke="url(#slh-ceramic-grad)" stroke-width="6.5" stroke-linecap="round"/>

      <!-- Rim & Crema -->
      <ellipse cx="105" cy="112" rx="52" ry="28" fill="#FDFBF7"/>
      <ellipse cx="105" cy="113" rx="47" ry="24" fill="url(#slh-crema-grad)"/>
      <ellipse cx="105" cy="114" rx="41" ry="20" fill="url(#slh-espresso-grad)"/>

      <!-- Salmon & Latte Core -->
      <g id="slh-core-heart" transform-origin="105 135">
        <path d="M 105,101 C 122,101 132,116 123,130 C 115,142 105,150 105,150 C 105,150 95,142 87,130 C 78,116 88,101 105,101 Z" 
              fill="url(#slh-salmon-grad)"/>
        <!-- Crema Ripple lines -->
        <path d="M 97,110 C 102,115 108,115 113,110" fill="none" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
        <path d="M 93,118 C 101,125 109,125 117,118" fill="none" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
        <!-- Spine -->
        <path d="M 105,103 C 106.5,114 103.5,126 105,143" fill="none" stroke="#FFF" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Matcha Accent -->
        <path d="M 105,99 C 107,93 114,91 116,93 C 117,97 112,101 105,103 Z" fill="url(#slh-matcha-grad)"/>
      </g>
    </g>
  </g>

  <!-- VERTICAL DIVIDER ACCENT -->
  <line x1="225" y1="45" x2="225" y2="175" stroke="#E2D9CC" stroke-width="1.5" stroke-dasharray="2 4"/>

  <!-- TYPOGRAPHY LOCKUP ON RIGHT -->
  <g id="slh-brand-typography" transform="translate(260, 0)">
    
    <!-- Japanese Kanji / Katakana sub-mark: 鮨 (Sushi) & 珈琲 (Coffee / Latte) -->
    <text x="0" y="58" class="japanese-sub" fill="#B08968" opacity="0.95">鮨 × 珈琲・ラテ</text>

    <!-- Main Wordmark: SUSHI LATTE -->
    <g id="slh-wordmark" transform="translate(0, 115)">
      <text x="0" y="0" class="brand-title" font-size="52" fill="#1A1D20">SUSHI</text>
      <!-- Warm Salmon Dot Divider -->
      <circle cx="218" cy="-14" r="6" fill="url(#slh-salmon-grad)"/>
      <text x="245" y="0" class="brand-title" font-size="52" fill="#C89666">LATTE</text>
    </g>

    <!-- Tagline: CRAFT SUSHI & SPECIALTY COFFEE -->
    <text x="3" y="152" class="brand-subtitle" fill="#6B7280">CRAFT SUSHI &amp; SPECIALTY COFFEE</text>

    <!-- Outlet / Tech Aesthetic Micro-Badge: EST. 2026 • SINGLE OUTLET -->
    <g transform="translate(3, 172)" opacity="0.75">
      <rect x="0" y="0" width="168" height="20" rx="4" fill="#F4EFE6"/>
      <text x="10" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#7C6A59" letter-spacing="0.12em">HORECA SERVICE SUITE</text>
    </g>
  </g>
</svg>
